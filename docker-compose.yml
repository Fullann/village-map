services:
  postgres:
    image: postgres:16-alpine
    container_name: village_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: village
      POSTGRES_PASSWORD: village_dev_password
      POSTGRES_DB: villagedb
    ports:
      - "54329:5432"
    volumes:
      - village_pgdata:/var/lib/postgresql/data

volumes:
  village_pgdata:

